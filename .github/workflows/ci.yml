# Offline tests on every push, on the newest releases inside the ranges in requirements.txt.
# They use a scripted fake model, so no API key is needed.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
